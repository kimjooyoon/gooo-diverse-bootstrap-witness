name: diverse-bootstrap-witness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Validate authoritative metacode
        run: go run ./cmd/witness audit --meta .gooo/diverse-bootstrap.gooo

  build-test-conformance:
    needs: semantic-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Prepare caller-owned output
        run: mkdir -p "$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
      - name: Check independent import closure
        run: ./scripts/check-independence.sh
      - name: Build verifier
        run: /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/build.metric" go build -trimpath -o "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/witness" ./cmd/witness
      - name: Run Go tests and retain exact event stream
        run: /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/test.metric" sh -c 'go test -json ./... > "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/test.json"'
      - name: Generate canonical IR and Go artifacts
        run: /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/conformance.metric" "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/witness" conformance --meta .gooo/diverse-bootstrap.gooo --repo-root "$GITHUB_WORKSPACE" --artifact-dir "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/artifacts" --report "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/conformance.json"
      - name: Build every generated Go artifact
        run: |
          work="$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
          mkdir -p "$work/built"
          /usr/bin/time -f '%e %M' -o "$work/generated-build.metric" sh -c '
            set -euo pipefail
            work="$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
            while IFS= read -r source; do
              relative="${source#"$work/artifacts/"}"
              case_dir="${relative%/*}"
              name="$(basename "$source" .generated.go)"
              mkdir -p "$work/built/$case_dir"
              go build -trimpath -o "$work/built/$case_dir/$name" "$source"
            done < <(find "$work/artifacts" -type f -name '*.generated.go' | sort)
          '
      - name: Run every generated Go artifact
        run: |
          work="$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
          mkdir -p "$work/runtime"
          /usr/bin/time -f '%e %M' -o "$work/generated-run.metric" sh -c '
            set -euo pipefail
            work="$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
            while IFS= read -r binary; do
              relative="${binary#"$work/built/"}"
              case_dir="${relative%/*}"
              name="$(basename "$binary")"
              mkdir -p "$work/runtime/$case_dir"
              "$binary" > "$work/runtime/$case_dir/$name.stdout"
            done < <(find "$work/built" -type f -perm -u+x | sort)
          '
      - name: Assemble exact CI evidence
        run: |
          work="$RUNNER_TEMP/gooo-diverse-bootstrap-witness"
          "$work/witness" evidence \
            --meta .gooo/diverse-bootstrap.gooo \
            --repo-root "$GITHUB_WORKSPACE" \
            --conformance "$work/conformance.json" \
            --artifact-dir "$work/artifacts" \
            --runtime-dir "$work/runtime" \
            --evidence "$work/evidence.json" \
            --build-metric "$work/build.metric" \
            --test-metric "$work/test.metric" \
            --conformance-metric "$work/conformance.metric" \
            --generated-build-metric "$work/generated-build.metric" \
            --generated-run-metric "$work/generated-run.metric" \
            --test-json "$work/test.json"
      - name: Verify evidence exists outside checkout
        run: test -s "$RUNNER_TEMP/gooo-diverse-bootstrap-witness/evidence.json" && test "$(git status --porcelain)" = ""
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-diverse-bootstrap-witness-evidence
          path: ${{ runner.temp }}/gooo-diverse-bootstrap-witness
          if-no-files-found: error
